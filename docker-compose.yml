services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/auth.db
      SEED_DEMO_DATA: "true"
      # set a long random value outside local development
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-please-change-me-0123456789}
      ACCESS_TOKEN_MINUTES: ${ACCESS_TOKEN_MINUTES:-15}
      REFRESH_TOKEN_DAYS: ${REFRESH_TOKEN_DAYS:-7}
    volumes:
      - auth-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  auth-data:
